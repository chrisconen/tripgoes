<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f35">
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-{{travelpayoutsHash}}' https://emrldco.com{{scriptExtra}}; style-src 'self' https://emrldco.com https://fonts.googleapis.com{{styleExtra}}; img-src 'self' data:{{imgExtra}}; font-src 'self' https://fonts.gstatic.com; connect-src {{connectSrc}}; frame-src {{frameSrc}}; object-src 'none'; base-uri 'none'; form-action 'none'">
<script nowprocket data-noptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1" data-cmp-ab="2">
  (function () {
      var script = document.createElement("script");
      script.async = 1;
      script.setAttribute("data-cmp-ab","2");
      script.src = 'https://emrldco.com/NTg4NDk2.js?t=588496';
      document.head.appendChild(script);
  })();
</script>
  <meta property="og:type" content="{{ogType}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{origin}}{{image}}">
  <meta property="og:image:alt" content="{{imageAlt}}">
  <meta name="twitter:card" content="summary_large_image">
  <title>{{title}}</title>
  <link rel="canonical" href="{{canonical}}">
  <link rel="alternate" hreflang="hu" href="{{origin}}/hu/{{route}}">
  <link rel="alternate" hreflang="en" href="{{origin}}/en/{{route}}">
  <link rel="alternate" hreflang="x-default" href="{{origin}}/hu/{{route}}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  {{preload}}
  <link rel="stylesheet" href="/src/styles.css">
  <link rel="stylesheet" href="/src/platform.css">
  {{extraStyles}}
  <script type="module" src="/src/app.mjs"></script>
</head>
<body data-page="{{page}}"><div id="app">{{content}}</div><noscript>TripGoes — Az interaktív utazástervező használatához engedélyezd a JavaScriptet. / Enable JavaScript to use the interactive travel planner.</noscript></body>
</html>
