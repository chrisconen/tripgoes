<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f35">
  <meta name="description" content="{{description}}">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{origin}}/assets/hero.jpg">
  <title>{{title}}</title>
  <link rel="canonical" href="{{canonical}}">
  <link rel="alternate" hreflang="hu" href="{{origin}}/hu/{{route}}">
  <link rel="alternate" hreflang="en" href="{{origin}}/en/{{route}}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/hero.jpg" as="image">
  <link rel="stylesheet" href="/src/styles.css">
  <script type="module" src="/src/app.mjs"></script>
</head>
<body><div id="app"></div><noscript>TripGoes — Az interaktív utazástervező használatához engedélyezd a JavaScriptet. / Enable JavaScript to use the interactive travel planner.</noscript></body>
</html>
