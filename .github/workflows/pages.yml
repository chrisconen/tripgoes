name: Publish TripGoes

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Trip prices move daily, so the published site is rebuilt from a fresh feed
  # every morning even when nothing was pushed.
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      # Refreshes content/packages.json in the workspace only — it is never
      # committed back. If the feed is unreachable the build falls back to the
      # snapshot in the repository, whose date the cards already show.
      - name: Refresh the trip feed
        continue-on-error: true
        run: node scripts/sync-packages.mjs
        env:
          INVIA_FEED_BOMBS: ${{ secrets.INVIA_FEED_BOMBS }}
          INVIA_FEED_DREAM: ${{ secrets.INVIA_FEED_DREAM }}
      # Runs after the refresh so a feed that returns unusable data fails here
      # and leaves the previous deployment serving, rather than shipping it.
      - name: Test pricing, score engine, content and outbound links
        run: npm test
      - name: Build bilingual site
        run: npm run build
        env:
          SITE_ORIGIN: https://tripgoes.com
      - name: Check deployment output
        run: node --test --test-isolation=none tests/build.test.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
